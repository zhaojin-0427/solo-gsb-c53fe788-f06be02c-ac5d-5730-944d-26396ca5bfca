<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>双区烘箱曲线试算</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <h1>双区烘箱曲线试算</h1>
      <p>四种响应轨迹联合约束 · 精确有理数递推 · Z3 10 秒限时优化</p>
    </div>
    <div class="header-actions">
      <button id="resetBtn" type="button" class="secondary">恢复示例</button>
      <button id="solveBtn" type="button">开始试算</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel input-panel">
      <h2>输入参数</h2>

      <div class="global-grid">
        <label>
          试算时长（分钟）
          <input id="duration" type="number" min="1" max="24" step="1" value="6" />
        </label>
        <label>
          相邻分钟最大跃变（℃）
          <input id="maxSetpointChange" type="number" min="0" max="300" step="1" value="80" />
        </label>
      </div>

      <div id="zones" class="zone-grid"></div>

      <div class="locks">
        <div class="section-heading">
          <h3>锁定设定温度</h3>
          <span>留空表示不锁定</span>
        </div>
        <div id="lockInputs" class="lock-grid"></div>
      </div>
    </section>

    <aside class="panel snapshot-panel">
      <h2>快照</h2>
      <p class="muted">每次试算均自动保存，包括无解与超时结果。</p>
      <div id="snapshotList" class="snapshot-list"></div>
    </aside>

    <section id="resultPanel" class="panel result-panel" hidden>
      <div class="result-header">
        <div>
          <h2>试算结果</h2>
          <span id="statusBadge" class="badge"></span>
        </div>
        <div id="solveMeta" class="solve-meta"></div>
      </div>
      <p id="resultMessage" class="result-message"></p>
      <div id="resultBody"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
